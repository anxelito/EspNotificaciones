# Publishes the landing page, the browser simulator and the 3D enclosure
# viewer to GitHub Pages on every push to master.
name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site/simulador _site/caja _site/designs
          cp site/index.html _site/
          cp firmware/tools/simulator/index.html _site/simulador/
          cp enclosure/viewer/index.html enclosure/viewer/screen.png _site/caja/
          cp -r docs/designs/. _site/designs/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
