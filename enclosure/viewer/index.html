<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cajas del panel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap">
<style>
:root{--bg:#0e1016;--panel:#171a23;--line:#262b37;--fg:#e9ebf0;--muted:#9098aa;--accent:#6ea6ff;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.45 Nunito,ui-rounded,system-ui,sans-serif;display:grid;grid-template-columns:300px minmax(0,1fr);height:100%}
@media (max-width:820px){body{grid-template-columns:1fr;grid-template-rows:auto 60vh}}
aside{background:var(--panel);border-right:1px solid var(--line);padding:18px 16px;overflow:auto;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-weight:900;font-size:24px}
.sub{margin:0;color:var(--muted);font-size:14px}
.models{display:flex;flex-direction:column;gap:6px}
.models button{font:inherit;text-align:left;border:1px solid var(--line);background:#1d212c;color:var(--fg);padding:9px 12px;border-radius:12px;cursor:pointer;display:flex;gap:10px;align-items:center}
.models button .n{font-weight:900;color:var(--accent);width:18px}
.models button[aria-pressed=true]{border-color:var(--accent);background:#20304d}
.models button:focus-visible,.swatch:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.lab{font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;flex-direction:column;gap:6px}
.swatches{display:flex;flex-wrap:wrap;gap:6px}
.swatch{width:30px;height:30px;border-radius:50%;border:2px solid #0006;cursor:pointer}
.swatch[aria-pressed=true]{outline:2px solid var(--fg);outline-offset:2px}
input[type=range]{width:100%;accent-color:var(--accent)}
.info{background:#11141b;border-radius:12px;padding:12px;font-size:14px;color:var(--muted)}
.info b{color:var(--fg)}
.info ul{margin:6px 0 0;padding-left:18px}
main{position:relative;min-height:0}
canvas{display:block;width:100%;height:100%}
.hint{position:absolute;left:16px;bottom:12px;color:var(--muted);font-size:13px;background:#0e1016cc;padding:6px 10px;border-radius:8px}
.title{position:absolute;left:16px;top:12px;font-weight:900;font-size:22px;text-shadow:0 2px 8px #000}
label.chk{display:flex;gap:8px;align-items:center;font-weight:700}
</style>
</head>
<body>
<aside>
  <div>
    <h1>Cajas del panel</h1>
    <p class="sub">Seis ideas para imprimir. Todas llevan la pantalla de 2.4", el ESP32, el DHT11 y el botón táctil. Gira con el ratón, rueda para hacer zoom.</p>
  </div>
  <div class="models" id="models"></div>
  <div class="row"><span class="lab">Color</span><div class="swatches" id="swatches"></div></div>
  <div class="row"><label class="lab" for="tilt">Inclinación <span id="tiltVal" style="color:var(--fg)"></span></label>
    <input type="range" id="tilt" min="0" max="25" step="1" value="12"></div>
  <label class="chk"><input type="checkbox" id="spin" checked> Girar sola</label>
  <div class="info" id="info"></div>
</aside>
<main>
  <canvas id="c"></canvas>
  <div class="title" id="title"></div>
  <div class="hint">Arrastra para girar · rueda para zoom · la pantalla es una captura real del panel</div>
</main>

<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { RoundedBoxGeometry } from "three/addons/geometries/RoundedBoxGeometry.js";

// ---------------- scene ----------------
const canvas = document.getElementById("c");
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x1a1d26);
const camera = new THREE.PerspectiveCamera(35, 1, 1, 3000);
camera.position.set(170, 120, 260);
const controls = new OrbitControls(camera, canvas);
controls.target.set(0, 45, 0);
controls.enableDamping = true;
controls.minDistance = 120; controls.maxDistance = 700;

scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2420, 0.9));
const sun = new THREE.DirectionalLight(0xffffff, 1.6);
sun.position.set(140, 260, 180); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -200, right: 200, top: 200, bottom: -200, near: 10, far: 800 });
scene.add(sun);
const fill = new THREE.DirectionalLight(0x9fb8ff, 0.5); fill.position.set(-200, 80, -100); scene.add(fill);

// desk
const desk = new THREE.Mesh(new THREE.CylinderGeometry(330, 330, 6, 64),
  new THREE.MeshStandardMaterial({ color: 0x6b4f3a, roughness: 0.75 }));
desk.position.y = -3; desk.receiveShadow = true; scene.add(desk);

// screen texture: real capture of the panel
const tex = new THREE.TextureLoader().load("screen.png");
tex.colorSpace = THREE.SRGBColorSpace;

// ---------------- helpers ----------------
const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.55, metalness: 0.05, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.castShadow = true; m.receiveShadow = true; return m;
}
const rbox = (w, h, d, r, mat, x, y, z) => mesh(new RoundedBoxGeometry(w, h, d, 5, Math.min(r, w / 2, h / 2, d / 2) - 0.01), mat, x, y, z);
function screen(g, x, y, z, w = 49.5, h = 37.2) {
  const s = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  s.position.set(x, y, z); g.add(s); return s;
}
function cyl(r, len, mat, x, y, z, axis = "z") {
  const m = mesh(new THREE.CylinderGeometry(r, r, len, 40), mat, x, y, z);
  if (axis === "z") m.rotation.x = Math.PI / 2; if (axis === "x") m.rotation.z = Math.PI / 2; return m;
}
const dark = M(0x15171d, { roughness: 0.4 });
const metal = M(0xc9d2e6, { roughness: 0.35, metalness: 0.4 });

let bodyMats = [];          // materials recoloured by the swatches
const bodyMat = () => { const m = M(state.color); bodyMats.push(m); return m; };
const accentMat = () => M(0xff6b8a, { roughness: 0.45 });

// Puts a model on the desk: leans it back by `tilt` around its front-bottom edge.
function place(g, tilt) {
  const holder = new THREE.Group();
  g.rotation.x = -THREE.MathUtils.degToRad(tilt);
  holder.add(g);
  holder.updateMatrixWorld(true);
  const bb = new THREE.Box3().setFromObject(holder);
  holder.position.y = -bb.min.y;
  holder.position.z = -(bb.min.z + bb.max.z) / 2;
  return holder;
}

// ---------------- models ----------------
// Each builder returns a group with its base at y=0, front facing +z.
const MODELS = [
 { id: "tv", name: "Mini TV retro", size: "112 × 78 × 72 mm", tilt: 12,
   info: ["Lo que ya tienes en Fusion.", "Rueda de arriba = botón táctil.", "DHT11 detrás de la rejilla lateral.", "Patas delanteras más largas para inclinarla."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     g.add(rbox(112, 78, 72, 10, bm, 0, 39 + 0, 0));
     g.add(rbox(62, 49, 4, 7, M(0x000000, { color: new THREE.Color(state.color).multiplyScalar(0.8) }), -12, 39, 35));
     g.add(rbox(53, 41, 2, 2, dark, -12, 39, 36.6));
     screen(g, -12, 39, 37.7);
     for (const [y, c] of [[50, 0x7a5a40], [30, 0x7a5a40]]) {
       g.add(cyl(8, 3, M(c), 40, y, 36.5)); g.add(cyl(5.6, 3.6, M(0x5a4030), 40, y, 36.6));
       g.add(rbox(1.6, 5, 4, .5, M(0xe9d9c2), 40, y + 3.2, 37));
     }
     for (let i = 0; i < 4; i++) g.add(rbox(18, 1.6, 2, .8, dark, 40, 18 - i * 3.5, 36.2));
     for (let i = 0; i < 6; i++) g.add(rbox(1.5, 1.8, 26, .7, dark, -56.2, 26 + i * 4.3, 11));
     const ant = M(0x5d6577, { metalness: .6, roughness: .3 });
     for (const s of [-1, 1]) {
       const rod = cyl(1.6, 50, ant, 0, 0, 0, "y"); rod.position.set(s * 13, 78 + 23, 7); rod.rotation.z = -s * 0.44; g.add(rod);
       g.add(mesh(new THREE.SphereGeometry(4.5, 24, 16), accentMat(), s * 24, 78 + 45, 7));
     }
     g.add(rbox(16, 6, 6, 2, ant, 0, 81, 7));
     const lf = 8 + 44 * Math.tan(THREE.MathUtils.degToRad(t)), legM = M(0x5d6577);
     for (const sx of [-1, 1]) {
       g.add(cyl(5, lf, legM, sx * 36, -lf / 2, 22, "y"));
       g.add(cyl(5, 8, legM, sx * 36, -4, -22, "y"));
     }
     g.rotation.x = 0; return g;
   } },
 { id: "robot", name: "Cabeza de robot", size: "116 × 118 × 80 mm", tilt: 10,
   info: ["Es el robot del panel en grande.", "Toque en la parte de arriba de la cabeza (TTP223 dentro).", "DHT11 detrás de la rejilla de la 'oreja'.", "La cabeza se inclina sobre el cuello."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     g.add(rbox(84, 30, 64, 12, bm, 0, 15, 0));                        // body
     g.add(cyl(9, 10, metal, 0, 33, 0, "y"));                          // neck
     const head = new THREE.Group(); head.position.set(0, 38, 0); head.rotation.x = -THREE.MathUtils.degToRad(t);
     head.add(rbox(116, 80, 76, 18, bm, 0, 40, 0));
     head.add(rbox(76, 56, 4, 12, dark, 0, 40, 37.2));
     screen(head, 0, 40, 39.3);
     for (const s of [-1, 1]) { head.add(cyl(9, 8, metal, s * 60, 40, 0, "x")); for (let i = 0; i < 4; i++) head.add(rbox(2, 14, 1.5, .6, dark, s * 64.2, 34 + i * 4, 0)); }
     head.add(cyl(1.8, 26, metal, 0, 93, 0, "y"));
     const glow = M(0x4fd18b, { emissive: 0x4fd18b, emissiveIntensity: .9 });
     head.add(mesh(new THREE.SphereGeometry(6, 24, 16), glow, 0, 108, 0));
     head.add(cyl(6, 1.5, M(0x4fd18b, { emissive: 0x4fd18b, emissiveIntensity: .5 }), 0, 80.6, 0, "y"));  // touch spot
     g.add(head);
     for (const s of [-1, 1]) g.add(rbox(14, 20, 14, 6, metal, s * 49, 18, 0));               // arms
     return g;
   } },
 { id: "pc", name: "Ordenador retro", size: "104 × 130 × 96 mm", tilt: 8,
   info: ["Todo en uno de los 80, beige.", "Ranura de 'disquete' = botón táctil detrás.", "Rejilla lateral para el DHT11.", "Pie en cuña que lo inclina."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     const wedgeH = 8 + 60 * Math.tan(THREE.MathUtils.degToRad(t));
     const shape = new THREE.Shape(); shape.moveTo(-40, 0); shape.lineTo(40, 0); shape.lineTo(40, 8); shape.lineTo(-40, wedgeH); shape.closePath();
     const foot = mesh(new THREE.ExtrudeGeometry(shape, { depth: 80, bevelEnabled: false }), M(new THREE.Color(state.color).multiplyScalar(.85)));
     foot.rotation.y = Math.PI / 2; foot.position.set(-40, 0, 0); g.add(foot);
     const body = new THREE.Group(); body.position.set(0, (wedgeH + 8) / 2, 0); body.rotation.x = -THREE.MathUtils.degToRad(t);
     body.add(rbox(104, 122, 96, 6, bm, 0, 61, 0));
     body.add(rbox(76, 60, 6, 6, M(new THREE.Color(state.color).multiplyScalar(.75)), 0, 80, 46));
     body.add(rbox(58, 46, 2, 3, dark, 0, 80, 48.6));
     screen(body, 0, 80, 49.7);
     body.add(rbox(34, 3, 2, 1, dark, 22, 30, 48.3));
     body.add(rbox(10, 6, 2, 1, M(0x4fd18b, { emissive: 0x1d5, emissiveIntensity: .4 }), -34, 30, 48.3));
     for (let i = 0; i < 8; i++) body.add(rbox(1.5, 30, 2, .6, dark, 52.4, 50 + i * 0 + 0, 30 - i * 6));
     g.add(body);
     return g;
   } },
 { id: "pod", name: "Cápsula espacial", size: "128 × 112 × 90 mm", tilt: 12,
   info: ["Combina con la estación del robot.", "Pantalla tras un ojo de buey con remaches.", "Toque en el piloto de arriba.", "Trípode de patas que la inclina."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     const pod = new THREE.Group(); pod.position.y = 64; pod.rotation.x = -THREE.MathUtils.degToRad(t);
     const shell = mesh(new THREE.SphereGeometry(60, 48, 32), bm); shell.scale.set(1.07, .9, .72); pod.add(shell);
     const band = mesh(new THREE.TorusGeometry(60.6, 3.4, 14, 96), M(0x3b4460, { metalness: .4 }));
     band.rotation.x = Math.PI / 2; band.scale.set(1.07, .72, 1); pod.add(band);          // equator band
     pod.add(cyl(37, 10, M(0x3b4460, { metalness: .4 }), 0, 0, 40));                      // porthole housing
     const ring = mesh(new THREE.TorusGeometry(36, 5, 18, 64), M(0x3b4460, { metalness: .5, roughness: .3 }), 0, 0, 46); pod.add(ring);
     pod.add(mesh(new THREE.CircleGeometry(33, 48), dark, 0, 0, 45.2));
     screen(pod, 0, 0, 45.8);
     for (let a = 0; a < 10; a++) { const r = 36, an = a / 10 * Math.PI * 2; pod.add(mesh(new THREE.SphereGeometry(1.6, 10, 8), metal, Math.cos(an) * r, Math.sin(an) * r, 50.5)); }
     const glow = M(0xff8a3d, { emissive: 0xff8a3d, emissiveIntensity: .8 });
     pod.add(mesh(new THREE.SphereGeometry(5, 20, 14), glow, 0, 54, 8));
     g.add(pod);
     const legM = M(0x5d6577, { metalness: .5 });
     for (const [x, z, l] of [[-34, 26, 40], [34, 26, 40], [0, -30, 28]]) {
       const leg = cyl(3, l, legM, x, l / 2, z, "y"); g.add(leg);
       g.add(cyl(7, 3, legM, x, 1.5, z, "y"));
     }
     return g;
   } },
 { id: "atril", name: "Atril minimal", size: "112 × 70 × 80 mm", tilt: 18,
   info: ["Cuña limpia, sin adornos.", "Pantalla enrasada en la cara inclinada.", "Toque en el punto grabado de arriba.", "Rejilla trasera para el DHT11."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     const a = THREE.MathUtils.degToRad(t + 50), H = 70, D = 80;
     const s = new THREE.Shape(); s.moveTo(0, 0); s.lineTo(D, 0); s.lineTo(D, 18); s.lineTo(D - 30, H); s.lineTo(20, H); s.lineTo(0, 22); s.closePath();
     const geo = new THREE.ExtrudeGeometry(s, { depth: 112, bevelEnabled: true, bevelSize: 3, bevelThickness: 3, bevelSegments: 4 });
     const w = mesh(geo, bm); w.rotation.y = -Math.PI / 2; w.position.set(56, 0, -D / 2); g.add(w);
     const face = new THREE.Group(); const fx = D - 15 - D / 2, fy = (18 + H) / 2;
     const ang = Math.atan2(30, H - 18);
     face.position.set(0, fy, (D - 15) - D / 2 + 3.4); face.rotation.x = -ang;
     face.add(rbox(60, 46, 2, 4, dark, 0, 0, 0)); screen(face, 0, 0, 1.2);
     g.add(face);
     g.add(cyl(5, 1, M(0x4fd18b, { emissive: 0x4fd18b, emissiveIntensity: .6 }), 36, H + 3.1, -12, "y"));
     return g;
   } },
 { id: "radio", name: "Radio vintage", size: "136 × 84 × 62 mm", tilt: 8,
   info: ["Radio de los 50 con asa.", "Altavoz de puntos a la izquierda (DHT11 detrás).", "Dial grande = botón táctil.", "Patitas cortas, ligera inclinación."],
   build(t) {
     const g = new THREE.Group(), bm = bodyMat();
     g.add(rbox(136, 84, 62, 16, bm, 0, 46, 0));
     g.add(rbox(136.6, 20, 62.6, 10, M(0xf4efe6), 0, 12 + 4, 0));
     g.add(rbox(54, 50, 4, 8, M(0xd9cbb3), -34, 52, 30));
     for (let i = 0; i < 7; i++) for (let j = 0; j < 6; j++) g.add(cyl(1.7, 1.5, dark, -52 + i * 6, 36 + j * 6.4, 32.4));
     g.add(rbox(56, 44, 2, 3, dark, 30, 52, 31.2)); screen(g, 30, 52, 32.3, 49.5, 37.2);
     g.add(cyl(9, 5, M(0x7a5a40), 30, 18, 31.5)); g.add(rbox(2, 7, 2, .5, M(0xf4efe6), 30, 22, 34));
     const h = mesh(new THREE.TorusGeometry(34, 4, 16, 48, Math.PI), M(0x5a4030)); h.position.set(0, 88, 0); g.add(h);
     for (const sx of [-1, 1]) { g.add(cyl(4, 6 + 4 * Math.tan(THREE.MathUtils.degToRad(t)) * 6, M(0x5a4030), sx * 50, 2, 18, "y")); g.add(cyl(4, 4, M(0x5a4030), sx * 50, 2, -18, "y")); }
     return g;
   } },
];

const COLORS = [["Crema", 0xe8ceaa], ["Blanco", 0xf2f2ee], ["Gris", 0x8a93a6], ["Negro", 0x2a2d35], ["Azul pastel", 0x8fb8e8], ["Menta", 0x9ed9bf], ["Rosa", 0xf2b5c4], ["Naranja", 0xf29a5e]];
const state = { model: 0, color: COLORS[0][1], tilt: MODELS[0].tilt, spin: true };
let current = null;

function rebuild() {
  if (current) { scene.remove(current); current.traverse(o => { o.geometry?.dispose?.(); }); }
  bodyMats = [];
  const m = MODELS[state.model];
  const g = m.build(state.tilt);
  current = m.id === "tv" ? place(g, state.tilt) : place(g, 0);
  scene.add(current);
  document.getElementById("title").textContent = m.name;
  document.getElementById("info").innerHTML = `<b>${m.name}</b> · ${m.size}<ul>${m.info.map(x => `<li>${x}</li>`).join("")}</ul>`;
}

// ---------------- UI ----------------
const list = document.getElementById("models");
MODELS.forEach((m, i) => {
  const b = document.createElement("button"); b.type = "button"; b.id = "m-" + m.id;
  b.innerHTML = `<span class="n">${String.fromCharCode(65 + i)}</span>${m.name}`;
  b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  b.onclick = () => { state.model = i; state.tilt = m.tilt; tilt.value = m.tilt; tiltVal.textContent = m.tilt + "°";
    list.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); rebuild(); };
  list.appendChild(b);
});
const sw = document.getElementById("swatches");
COLORS.forEach(([n, c], i) => {
  const b = document.createElement("button"); b.type = "button"; b.className = "swatch"; b.id = "c-" + i; b.title = n; b.setAttribute("aria-label", n);
  b.style.background = "#" + c.toString(16).padStart(6, "0"); b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
  b.onclick = () => { state.color = c; sw.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false")); rebuild(); };
  sw.appendChild(b);
});
const tilt = document.getElementById("tilt"), tiltVal = document.getElementById("tiltVal");
tiltVal.textContent = state.tilt + "°";
tilt.oninput = () => { state.tilt = +tilt.value; tiltVal.textContent = tilt.value + "°"; rebuild(); };
document.getElementById("spin").onchange = e => { state.spin = e.target.checked; };

function resize() {
  const r = canvas.parentElement.getBoundingClientRect();
  renderer.setSize(r.width, r.height, false); camera.aspect = r.width / r.height; camera.updateProjectionMatrix();
}
addEventListener("resize", resize); resize();
rebuild();
renderer.setAnimationLoop(() => {
  if (state.spin && current) current.rotation.y += 0.004;
  controls.update(); renderer.render(scene, camera);
});
</script>
</body>
</html>
